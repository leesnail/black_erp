# BLACK ERP nginx 配置（docker-compose 内网部署 + frp 穿透通用）
server {
    listen 80;
    server_name _;

    client_max_body_size 60m;   # 须 > MAX_UPLOAD_MB（默认 50）

    # 前端静态（SPA）
    root /usr/share/nginx/html;
    index index.html;

    # 后端 API
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;      # 大文件上传/预检
        proxy_send_timeout 300s;
    }

    # 健康检查
    location /health {
        proxy_pass http://app:8000;
    }

    # 上传文件静态直链（生产建议改为鉴权代理，见部署文档）
    location /data/ {
        proxy_pass http://app:8000;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
