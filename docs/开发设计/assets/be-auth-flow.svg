<text x="640" y="580" font-size="12" fill="#909399" text-anchor="middle">默认角色覆盖见 01-信息架构与权限设计.md §2；管理员可在角色默认之上做个人覆盖</text>
<text x="640" y="610" font-size="12" fill="#D9534F" text-anchor="middle">前端菜单/按钮按 perms 过滤只是体验；安全边界在 perm 依赖（403）</text>
</svg>