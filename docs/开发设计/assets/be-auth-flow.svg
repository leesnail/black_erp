<text x="800" y="460" font-size="11" fill="#606266" text-anchor="start">price.write / import</text>
<text x="1000" y="460" font-size="11" fill="#1B5E38" text-anchor="start">采购</text>
<text x="84" y="476" font-size="11" fill="#303133" text-anchor="start" font-weight="bold">master.shop_product</text>
