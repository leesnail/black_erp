<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Microsoft YaHei, PingFang SC, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#909399"/></marker></defs><rect width="1280" height="700" fill="#FFFFFF"/><text x="640" y="36" font-size="20" fill="#303133" text-anchor="middle" font-weight="bold">前端登录态与路由守卫流程</text>
<rect x="60" y="80" width="200" height="80" rx="10" fill="#fff" stroke="#409EFF" stroke-width="2"/>
<text x="160" y="106" font-size="13" fill="#409EFF" text-anchor="middle" font-weight="bold">用户访问任意路由</text>
<text x="160" y="128" font-size="11" fill="#606266" text-anchor="middle">router.beforeEach</text>
<rect x="320" y="80" width="200" height="80" rx="10" fill="#fff" stroke="#E6A23C" stroke-width="2"/>
<text x="420" y="106" font-size="13" fill="#E6A23C" text-anchor="middle" font-weight="bold">authStore.user?</text>
<text x="420" y="128" font-size="11" fill="#606266" text-anchor="middle">未登录→/login</text>
<text x="420" y="144" font-size="11" fill="#606266" text-anchor="middle">带 redirect 参数</text>
<rect x="580" y="80" width="200" height="80" rx="10" fill="#fff" stroke="#1B5E38" stroke-width="2"/>
<text x="680" y="106" font-size="13" fill="#1B5E38" text-anchor="middle" font-weight="bold">perms 已加载?</text>
<text x="680" y="128" font-size="11" fill="#606266" text-anchor="middle">否→GET /auth/me</text>
<text x="680" y="144" font-size="11" fill="#606266" text-anchor="middle">成功写 store</text>
<rect x="840" y="80" width="200" height="80" rx="10" fill="#fff" stroke="#67C23A" stroke-width="2"/>
<text x="940" y="106" font-size="13" fill="#67C23A" text-anchor="middle" font-weight="bold">route.meta.perm?</text>
<text x="940" y="128" font-size="11" fill="#606266" text-anchor="middle">无 perm→放行</text>
<text x="940" y="144" font-size="11" fill="#606266" text-anchor="middle">有→校验</text>
<rect x="1100" y="80" width="200" height="80" rx="10" fill="#fff" stroke="#D9534F" stroke-width="2"/>
<text x="1200" y="106" font-size="13" fill="#D9534F" text-anchor="middle" font-weight="bold">通过?</text>
<text x="1200" y="128" font-size="11" fill="#606266" text-anchor="middle">否→403 页</text>
<text x="1200" y="144" font-size="11" fill="#606266" text-anchor="middle">是→next()</text>
<line x1="260" y1="120" x2="320" y2="120" stroke="#909399" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="520" y1="120" x2="580" y2="120" stroke="#909399" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="780" y1="120" x2="840" y2="120" stroke="#909399" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="1040" y1="120" x2="1100" y2="120" stroke="#909399" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="210" width="560" height="200" rx="10" fill="#fff" stroke="#E4E7ED" stroke-width="1"/>
<text x="84" y="240" font-size="15" fill="#303133" text-anchor="start" font-weight="bold">登录页流程</text>
<text x="84" y="272" font-size="12" fill="#606266" text-anchor="start">1. POST /auth/login {account, password}</text>
<text x="84" y="294" font-size="12" fill="#606266" text-anchor="start">2. 成功 → store.setUser(me) + perms</text>
<text x="84" y="316" font-size="12" fill="#606266" text-anchor="start">3. redirect = route.query.redirect || 默认页</text>
<text x="84" y="338" font-size="12" fill="#606266" text-anchor="start">   默认页按角色：客服→/service/aftersale</text>
<text x="84" y="360" font-size="12" fill="#606266" text-anchor="start">   财务→/calc/upload  老板→/report/cockpit</text>
<text x="84" y="382" font-size="12" fill="#606266" text-anchor="start">4. 失败：统一&quot;账号或密码错误&quot;；</text>
<text x="84" y="404" font-size="12" fill="#606266" text-anchor="start">   连续失败前端禁用按钮 15s 防爆破</text>
<rect x="660" y="210" width="560" height="200" rx="10" fill="#fff" stroke="#E4E7ED" stroke-width="1"/>
<text x="684" y="240" font-size="15" fill="#303133" text-anchor="start" font-weight="bold">会话失效处理（401）</text>
<text x="684" y="272" font-size="12" fill="#606266" text-anchor="start">1. Axios 响应拦截器捕获 401</text>
<text x="684" y="294" font-size="12" fill="#606266" text-anchor="start">2. authStore.logout() 清本地态</text>
<text x="684" y="316" font-size="12" fill="#606266" text-anchor="start">3. ElMessage.warning(&quot;登录已过期&quot;)</text>
<text x="684" y="338" font-size="12" fill="#606266" text-anchor="start">4. router.replace(/login?redirect=当前 fullPath)</text>
<text x="684" y="360" font-size="12" fill="#606266" text-anchor="start">5. 防并发：401 只触发一次跳转（flag）</text>
<text x="684" y="382" font-size="12" fill="#606266" text-anchor="start"></text>
<text x="684" y="404" font-size="12" fill="#606266" text-anchor="start">登出：POST /auth/logout → 清 store → /login</text>
<rect x="60" y="440" width="1160" height="220" rx="10" fill="#F5F7FA" stroke="#E4E7ED" stroke-width="1"/>
<text x="84" y="472" font-size="15" fill="#303133" text-anchor="start" font-weight="bold">菜单渲染（MainLayout）</text>
<text x="84" y="504" font-size="13" fill="#606266" text-anchor="start">perms 数组 → MENU_TREE 过滤 → el-menu 递归渲染</text>
<text x="84" y="536" font-size="12" fill="#1B5E38" text-anchor="start">MENU_TREE = [</text>
<text x="84" y="558" font-size="12" fill="#1B5E38" text-anchor="start">  { path: &quot;/service&quot;, perm: &quot;service&quot;, children: [</text>
<text x="84" y="580" font-size="12" fill="#1B5E38" text-anchor="start">    { path: &quot;aftersale&quot;, perm: &quot;service.list&quot;, title: &quot;售后登记&quot; }, ...</text>
<text x="84" y="602" font-size="12" fill="#1B5E38" text-anchor="start">  ]},</text>
<text x="84" y="624" font-size="12" fill="#1B5E38" text-anchor="start">  { path: &quot;/calc&quot;, perm: &quot;calc&quot;, children: [...] },</text>
<text x="84" y="646" font-size="12" fill="#1B5E38" text-anchor="start">]</text>
<text x="84" y="668" font-size="12" fill="#1B5E38" text-anchor="start">// visible = perms.includes(node.perm) 或任一子节点可见</text>
<text x="700" y="536" font-size="13" fill="#303133" text-anchor="start" font-weight="bold">v-perm 自定义指令：</text>
<text x="700" y="562" font-size="12" fill="#1B5E38" text-anchor="start">app.directive(&quot;perm&quot;, {</text>
<text x="700" y="582" font-size="12" fill="#1B5E38" text-anchor="start">  mounted(el, {value}) {</text>
<text x="700" y="602" font-size="12" fill="#1B5E38" text-anchor="start">    if (!hasPerm(value)) el.remove()</text>
<text x="700" y="622" font-size="12" fill="#1B5E38" text-anchor="start">  }</text>
<text x="700" y="642" font-size="12" fill="#1B5E38" text-anchor="start">})</text>
</svg>