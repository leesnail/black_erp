<text x="720" y="554" font-size="12" fill="#606266" text-anchor="start">· 登录后 Cookie Session（HttpOnly）；写操作需 X-CSRF-Token</text>
<text x="720" y="574" font-size="12" fill="#606266" text-anchor="start">· 鉴权：Depends(perm(&quot;模块.动作&quot;))，未授权 403</text>
<text x="720" y="594" font-size="12" fill="#606266" text-anchor="start">· 金额字段 JSON 序列化为字符串（防浮点误差）</text>
<text x="720" y="614" font-size="12" fill="#606266" text-anchor="start">· 列表接口统一 {items, total, page, page_size}</text>
<text x="720" y="634" font-size="12" fill="#606266" text-anchor="start">· 文件上传走 multipart，单文件 ≤ 50MB</text>
