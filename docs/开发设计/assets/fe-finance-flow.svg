<line x1="144" y1="442" x2="144" y2="446" stroke="#909399" stroke-width="1.5"/>
<rect x="64" y="446" width="160" height="24" rx="4" fill="#fff" stroke="#D9534F" stroke-width="1"/>
<text x="144" y="463" font-size="12" fill="#D9534F" text-anchor="middle" font-weight="bold">success / failed</text>
<text x="250" y="463" font-size="12" fill="#606266" text-anchor="start">终态（可重算→新批次）</text>
<rect x="680" y="260" width="560" height="240" rx="10" fill="#fff" stroke="#E4E7ED" stroke-width="1"/>
<text x="704" y="290" font-size="15" fill="#303133" text-anchor="start" font-weight="bold">轮询 usePolling 实现要点</text>
<text x="704" y="322" font-size="12" fill="#606266" text-anchor="start">· 基础间隔 2000ms；连续 3 次 pending 无变化 → 改 5000ms</text>
<text x="704" y="346" font-size="12" fill="#606266" text-anchor="start">· status=success/failed 立即 stop()</text>
<text x="704" y="370" font-size="12" fill="#606266" text-anchor="start">· 组件 unmount / 路由离开 → stop()（防泄漏）</text>
<text x="704" y="394" font-size="12" fill="#606266" text-anchor="start">· 401 时 stop 并由全局拦截器处理</text>
<text x="704" y="418" font-size="12" fill="#606266" text-anchor="start">· failed 展示 err_msg + [重试] 按钮（POST recalc）</text>
<text x="704" y="442" font-size="12" fill="#606266" text-anchor="start">· 轮询与 SSE 二选一：首版轮询简单可靠；</text>
<text x="704" y="466" font-size="12" fill="#606266" text-anchor="start">  二期数据量大时可换 WebSocket 推送进度</text>
<rect x="40" y="530" width="1200" height="200" rx="10" fill="#F5F7FA" stroke="#E4E7ED" stroke-width="1"/>
