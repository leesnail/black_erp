<rect x="40" y="560" width="1200" height="220" rx="10" fill="#F5F7FA" stroke="#E4E7ED" stroke-width="1"/>
<text x="64" y="592" font-size="15" fill="#303133" text-anchor="start" font-weight="bold">关键约束与实现要点</text>
<text x="64" y="620" font-size="12" fill="#1B5E38" text-anchor="start" font-weight="bold">· spec_code 生成</text>
<text x="200" y="620" font-size="12" fill="#606266" text-anchor="start">Redis INCR 序列（key: spec:seq）→ SP%06d；DB 唯一索引兜底；并发安全不依赖 max(code)+1</text>
<text x="64" y="646" font-size="12" fill="#1B5E38" text-anchor="start" font-weight="bold">· 价格不可变</text>
<text x="200" y="646" font-size="12" fill="#606266" text-anchor="start">CostPrice 只 INSERT 不 UPDATE；计算取 effective_at≤批次日 的最新一条 → OrderLine 存快照值</text>
<text x="64" y="672" font-size="12" fill="#1B5E38" text-anchor="start" font-weight="bold">· 批次不可变</text>
<text x="200" y="672" font-size="12" fill="#606266" text-anchor="start">重算=新 Batch(version+1) 指向同一 source_key；OrderLine 仅 INSERT；未匹配回填只允许非 settled 批次</text>
<text x="64" y="698" font-size="12" fill="#1B5E38" text-anchor="start" font-weight="bold">· 登记约束</text>
<text x="200" y="698" font-size="12" fill="#606266" text-anchor="start">ShopProduct 同 (shop_id, title_keyword, sale_price) 唯一；spec 仅能从选择器选入（API 校验 spec_id 存在且启用）</text>
<text x="64" y="724" font-size="12" fill="#1B5E38" text-anchor="start" font-weight="bold">· 金额类型</text>
<text x="200" y="724" font-size="12" fill="#606266" text-anchor="start">MySQL DECIMAL(12,2)；SQLAlchemy Numeric；Pydantic condecimal；代码内 Decimal，禁 float</text>
<text x="64" y="750" font-size="12" fill="#1B5E38" text-anchor="start" font-weight="bold">· 一单多品</text>
<text x="200" y="750" font-size="12" fill="#606266" text-anchor="start">CSV 一行一个子订单号；选购商品含多条时逐行拆分归集（Q11 逐行归集）</text>
</svg>