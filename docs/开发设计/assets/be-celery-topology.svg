<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Microsoft YaHei, PingFang SC, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#909399"/></marker></defs><rect width="1280" height="640" fill="#FFFFFF"/><text x="640" y="36" font-size="20" fill="#303133" text-anchor="middle" font-weight="bold">Celery 任务拓扑与队列划分</text>
<rect x="40" y="80" width="240" height="160" rx="10" fill="#fff" stroke="#E6A23C" stroke-width="2"/>
<text x="160" y="108" font-size="15" fill="#E6A23C" text-anchor="middle" font-weight="bold">celery beat</text>
<text x="56" y="138" font-size="12" fill="#606266" text-anchor="start">· 日报生成 09:00 (report)</text>
<text x="56" y="160" font-size="12" fill="#606266" text-anchor="start">· 发票提醒扫描 每时 (reminder)</text>
<text x="56" y="182" font-size="12" fill="#606266" text-anchor="start">· 导出清理 03:00 (report)</text>
<text x="56" y="204" font-size="12" fill="#606266" text-anchor="start">· 价格快照预热（可选）</text>
<rect x="400" y="80" width="200" height="160" rx="10" fill="#fff" stroke="#D9534F" stroke-width="2"/>
<text x="500" y="108" font-size="15" fill="#D9534F" text-anchor="middle" font-weight="bold">Redis</text>
<text x="416" y="138" font-size="12" fill="#606266" text-anchor="start">· 队列 calc/report/</text>
<text x="416" y="160" font-size="12" fill="#606266" text-anchor="start">·   reminder</text>
<text x="416" y="182" font-size="12" fill="#606266" text-anchor="start">· 分布式锁 batch:*</text>
<text x="416" y="204" font-size="12" fill="#606266" text-anchor="start">· 会话 session:*</text>
<rect x="700" y="80" width="220" height="140" rx="10" fill="#fff" stroke="#1B5E38" stroke-width="2"/>
<rect x="700" y="80" width="220" height="32" rx="10" fill="#1B5E38"/>
<rect x="700" y="100" width="220" height="12" rx="0" fill="#1B5E38"/>
<text x="810" y="102" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">worker-calc</text>
<text x="716" y="138" font-size="12" fill="#606266" text-anchor="start">queue=calc</text>
<text x="716" y="156" font-size="12" fill="#606266" text-anchor="start">prefetch=1</text>
<text x="716" y="174" font-size="12" fill="#606266" text-anchor="start">并发=CPU-1</text>
<rect x="700" y="260" width="220" height="140" rx="10" fill="#fff" stroke="#06B6D4" stroke-width="2"/>
<rect x="700" y="260" width="220" height="32" rx="10" fill="#06B6D4"/>
<rect x="700" y="280" width="220" height="12" rx="0" fill="#06B6D4"/>
<text x="810" y="282" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">worker-report</text>
<text x="716" y="318" font-size="12" fill="#606266" text-anchor="start">queue=report</text>
<text x="716" y="336" font-size="12" fill="#606266" text-anchor="start">日报聚合/导出</text>
<rect x="980" y="80" width="220" height="140" rx="10" fill="#fff" stroke="#67C23A" stroke-width="2"/>
<rect x="980" y="80" width="220" height="32" rx="10" fill="#67C23A"/>
<rect x="980" y="100" width="220" height="12" rx="0" fill="#67C23A"/>
<text x="1090" y="102" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">worker-reminder</text>
<text x="996" y="138" font-size="12" fill="#606266" text-anchor="start">queue=reminder</text>
<text x="996" y="156" font-size="12" fill="#606266" text-anchor="start">发票8天扫描</text>
<text x="996" y="174" font-size="12" fill="#606266" text-anchor="start">失败重试3次</text>
<rect x="980" y="260" width="220" height="140" rx="10" fill="#fff" stroke="#909399" stroke-width="2"/>
<rect x="980" y="260" width="220" height="32" rx="10" fill="#909399"/>
<rect x="980" y="280" width="220" height="12" rx="0" fill="#909399"/>
<text x="1090" y="282" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">（预留）worker-ocr</text>
<text x="996" y="318" font-size="12" fill="#606266" text-anchor="start">queue=ocr</text>
<text x="996" y="336" font-size="12" fill="#606266" text-anchor="start">二期启用</text>
<line x1="280" y1="160" x2="400" y2="160" stroke="#909399" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="600" y1="140" x2="700" y2="150" stroke="#1B5E38" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="600" y1="170" x2="700" y2="270" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="600" y1="180" x2="980" y2="150" stroke="#67C23A" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="600" y1="190" x2="980" y2="300" stroke="#909399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah)"/>
<rect x="40" y="460" width="1200" height="140" rx="10" fill="#F5F7FA" stroke="#E4E7ED" stroke-width="1"/>
<text x="64" y="492" font-size="14" fill="#303133" text-anchor="start" font-weight="bold">compose 服务与环境变量</text>
<text x="64" y="522" font-size="12" fill="#606266" text-anchor="start">· CELERY_BROKER_URL=redis://redis:6379/0   RESULT_EXPIRES=86400</text>
<text x="64" y="546" font-size="12" fill="#606266" text-anchor="start">· worker 启动：celery -A app.tasks worker -Q calc,report,reminder -c 2 -Ofair</text>
<text x="64" y="570" font-size="12" fill="#606266" text-anchor="start">· 任务幂等：task_id = f&quot;calc:{batch_id}&quot;；重复 enqueue 由 Redis SETNX 拦截</text>
<text x="700" y="522" font-size="12" fill="#606266" text-anchor="start">监控：flower 可选（二期）；</text>
<text x="700" y="546" font-size="12" fill="#606266" text-anchor="start">Batch running&gt;30min 触发告警 Reminder</text>
</svg>